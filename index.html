<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noah's Vault - Seed Vault Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eff0; --card:#fbfdfd; --line:#cfdadb; --line2:#bccccc;
  --ink:#1d2a2e; --dim:#5d7177; --faint:#8ba0a6;
  --pine:#177a52; --pine-deep:#0d5c3d; --amber:#b45309; --lost:#b3553f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:38px 16px 56px;background-image:linear-gradient(rgba(29,42,46,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(29,42,46,.035) 1px,transparent 1px);background-size:44px 44px}
.wrap{width:min(760px,95vw)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;text-transform:uppercase}
h1 span{color:var(--pine)}
.sub{color:var(--dim);font-family:'IBM Plex Mono',monospace;letter-spacing:1.6px;font-size:10.5px;text-transform:uppercase;margin-top:6px}
.station{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);text-align:right;line-height:1.9;text-transform:uppercase;letter-spacing:1.2px}
.station b{color:var(--pine);font-weight:600}
#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.read{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.read .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.read .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
.read .v.ok{color:var(--pine)} .read .v.warn{color:var(--amber)} .read .v.bad{color:var(--lost)}
#vault{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;aspect-ratio:1/.86;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.cell svg{color:var(--pine)}
.cell small{font-size:8.5px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;text-align:center;font-weight:600}
.cell.lost{border-style:dashed;border-color:var(--line2);background:transparent}
.cell.lost small{color:var(--lost)}
#event{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:18px 20px;min-height:92px;font-size:15px;line-height:1.65;box-shadow:0 1px 0 rgba(29,42,46,.05)}
#event .tag{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:2px;display:block;margin-bottom:8px}
#event.win{border-left-color:var(--pine)} #event.win .tag{color:var(--pine)}
#choices{display:grid;gap:8px;margin-top:10px}
button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:13px 16px;font-family:inherit;font-size:14px;font-weight:600;text-align:left;transition:border-color .15s,transform .15s;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
button:hover{border-color:var(--pine);transform:translateX(3px)}
button small{color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;flex:none}
#log{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);line-height:1.8}
footer{margin-top:24px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;text-align:center}
@media(max-width:640px){#hud{grid-template-columns:repeat(2,1fr)}#vault{grid-template-columns:repeat(3,1fr)}button{flex-direction:column;gap:3px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Noah&rsquo;s <span>Vault</span></h1>
    <div class="sub">Seed preservation protocol &middot; Clearance: Curator</div>
  </div>
  <div class="station">Svalbard Annex 7<br>78.2&deg;N &middot; permafrost<br><b>status: operational</b></div>
</header>
<div id="hud"></div>
<div id="vault"></div>
<div id="event"></div>
<div id="choices"></div>
<div id="log"></div>
<footer>Ninety meters inside the mountain &middot; the door stays closed</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const IC={
 wheat:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 22V8"/><path d="M12 8c-3 0-4-2.5-4-5 2.5 0 4 1.5 4 5zM12 8c3 0 4-2.5 4-5-2.5 0-4 1.5-4 5zM12 14c-3 0-4-2.5-4-5 2.5 0 4 1.5 4 5zM12 14c3 0 4-2.5 4-5-2.5 0-4 1.5-4 5zM12 20c-3 0-4-2.5-4-5 2.5 0 4 1.5 4 5zM12 20c3 0 4-2.5 4-5-2.5 0-4 1.5-4 5z"/></svg>',
 rice:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 21c0-6 1-12 7-17"/><path d="M12 4c1.5 2 1 4.5-1 6M12 4c-2 1-3.5 3.5-3 6.5M12 4c3 1 5 4 4.5 8" /><path d="M8.5 11.5C7 13 6.5 15 7 17M12.5 10c1 2.5.5 5.5-1.5 7.5"/></svg>',
 maize:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.5 0 4 3.5 4 8s-1.5 8-4 8-4-3.5-4-8 1.5-8 4-8z"/><path d="M12 3v16M9 7h6M9 11h6M9 15h6" stroke-width="1.2"/><path d="M8 19c-2-1-3-3-3-5M16 19c2-1 3-3 3-5"/></svg>',
 potato:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4c4 0 7 3.5 7 8s-3.5 8-8 8-8-3-8-7 2.5-7 6-7c2 0 1-2 3-2z" stroke-linejoin="round"/><circle cx="10" cy="10" r=".6" fill="currentColor"/><circle cx="14" cy="13" r=".6" fill="currentColor"/><circle cx="9" cy="15" r=".6" fill="currentColor"/></svg>',
 apple:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c-4-2.5-8 .5-8 5 0 4.5 3.5 8 6 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2.5 0 6-3.5 6-8 0-4.5-4-7.5-8-5z"/><path d="M12 8c0-2.5 1-4.5 3-5.5"/><path d="M12 5c-2-1.5-4-1-5 1"/></svg>',
 cacao:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 4c3.5 1.5 6 5 6 9s-2.5 6.5-6 7c-3.5-.5-6-3-6-7s2.5-7.5 6-9z"/><path d="M12 4v16M9 6.5C8 9 8 15 9 18.5M15 6.5c1 2.5 1 8.5 0 12" stroke-width="1.2"/></svg>'
};
const SEEDS=[['Wheat','wheat'],['Rice','rice'],['Maize','maize'],['Potato','potato'],['Apple','apple'],['Cacao','cacao']];
const S={day:1,temp:-18,power:100,integrity:100,lost:0,over:false};
const EVENTS=[
 ['INCIDENT','Permafrost readings spike. Thermal drift detected in corridor C.',[['Vent emergency coolant','power -15, temp stabilized',s=>{s.power-=15;s.temp=-18}],['Let it ride','temp rises 4C, seeds at risk',s=>{s.temp+=4}],['Send a tech into the tunnel','integrity -8, temp -2C',s=>{s.integrity-=8;s.temp-=2}]]],
 ['INCIDENT','A consortium offers funding for one shelf of pharma crops. The vault charter says food only.',[['Refuse, cite the charter','integrity +10',s=>{s.integrity+=10}],['Accept quietly','power +20, integrity -12',s=>{s.power+=20;s.integrity-=12}],['Negotiate: they fund the roof','power +10, integrity -4',s=>{s.power+=10;s.integrity-=4}]]],
 ['INCIDENT','Generator 2 is down. Generator 1 hums louder than it should.',[['Ration power to the cold rooms','power +12, integrity -4',s=>{s.power+=12;s.integrity-=4}],['Run both hard','power -10, temp -1C',s=>{s.power-=10;s.temp-=1}],['Pray to the diesel gods','nothing happens, but morale',s=>{}]]],
 ['INCIDENT','A nation requests its seeds back. Withdrawal protocol 12-B. The boxes look small in their hands.',[['Release the deposit','integrity +8, one seed line leaves',s=>{s.integrity+=8}],['Stall for paperwork','integrity -6',s=>{s.integrity-=6}],['Offer duplicates instead','integrity +3',s=>{s.integrity+=3}]]],
 ['INCIDENT','Mold spores detected on level 2. The air smells sweet. That is bad.',[['Purge the level','power -12, threat removed',s=>{s.power-=12}],['Quarantine one shelf','lose a seed line',s=>{s.lost+=1}],['Increase airflow','temp +2C, maybe fine',s=>{s.temp+=2;if(Math.random()<.4)s.lost+=1}]]],
 ['INCIDENT','An inspector arrives unannounced. Her badge is real. Her questions are better.',[['Full transparency','integrity +8',s=>{s.integrity+=8}],['Show her the good shelves','risky integrity',s=>{if(Math.random()<.5){s.integrity+=4}else{s.integrity-=15}}],['Wine and distract','integrity -5, power +5',s=>{s.integrity-=5;s.power+=5}]]],
 ['INCIDENT','Deep frost heave. A wall crack whispers in the night shift audio logs.',[['Immediate repairs','power -8, integrity +10',s=>{s.power-=8;s.integrity+=10}],['Monitor it','integrity -8',s=>{s.integrity-=8}],['Log it as settling','integrity -3, power +3',s=>{s.integrity-=3;s.power+=3}]]],
 ['INCIDENT','A new deposit arrives: heirloom tomatoes from a closed garden. Someone cried handing them over.',[['Catalog with full honors','integrity +6',s=>{s.integrity+=6}],['Standard intake','nothing special',s=>{}],['Expedited, skip quarantine','risky: spores?',s=>{if(Math.random()<.3)s.lost+=1}]]]];
function clamp(x){return Math.max(0,Math.min(100,x))}
function hud(){
 const tc=S.temp>-14?'bad':(S.temp>-16?'warn':'ok');
 const pc=S.power<25?'bad':(S.power<50?'warn':'ok');
 const ic=S.integrity<25?'bad':(S.integrity<50?'warn':'ok');
 $('hud').innerHTML=
 '<div class="read"><div class="k">Day</div><div class="v ok">'+S.day+'<span style="color:var(--faint);font-size:12px"> / 15</span></div></div>'+
 '<div class="read"><div class="k">Temp</div><div class="v '+tc+'">'+S.temp+'&deg;C</div></div>'+
 '<div class="read"><div class="k">Power</div><div class="v '+pc+'">'+S.power+'%</div></div>'+
 '<div class="read"><div class="k">Charter</div><div class="v '+ic+'">'+S.integrity+'%</div></div>'+
 '<div class="read"><div class="k">Lines lost</div><div class="v '+(S.lost?'bad':'ok')+'">'+S.lost+'</div></div>';
 $('vault').innerHTML=SEEDS.map((s,i)=>'<div class="cell'+(i<S.lost?' lost':'')+'">'+(i<S.lost?'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b3553f" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>':IC[s[1]])+'<small>'+(i<S.lost?'Lost':s[0])+'</small></div>').join('');}
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;$('log').prepend(d);}
function render(){
 hud();if(S.over)return;
 const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
 $('event').className='';
 $('event').innerHTML='<span class="tag">'+ev[0]+' // DAY '+S.day+'</span>'+ev[1];
 $('choices').innerHTML='';
 ev[2].forEach(o=>{
  const b=document.createElement('button');
  b.innerHTML='<span>'+o[0]+'</span><small>'+o[1]+'</small>';
  b.onclick=()=>{o[2](S);S.power=clamp(S.power);S.integrity=clamp(S.integrity);
   log('Day '+S.day+': '+o[0]+'.');
   S.day++;
   if(S.power<=0){end(false,'Power failed on day '+S.day+'. The cold rooms warm by degrees. 900,000 futures, compost.');}
   else if(S.integrity<=0){end(false,'The charter is revoked. The vault becomes a very cold warehouse for someone else\'s priorities.');}
   else if(S.lost>=3){end(false,'Too many lines lost. The ark floats, but it is emptier than the flood would have left it.');}
   else if(S.day>15){end(true,'Fifteen days. Every seed accounted for. Somewhere above the permafrost, nothing happened - and that was everything.');}
   else render();};
  $('choices').appendChild(b);});}
function end(win,msg){S.over=true;hud();$('event').className=win?'win':'';
 $('event').innerHTML='<span class="tag">'+(win?'ROTATION COMPLETE':'FINAL LOG')+'</span>'+msg;
 $('choices').innerHTML='';const b=document.createElement('button');
 b.innerHTML='<span>Begin a new rotation</span>';b.onclick=()=>{Object.assign(S,{day:1,temp:-18,power:100,integrity:100,lost:0,over:false});$('log').innerHTML='';render();};
 $('choices').appendChild(b);log(msg,win?'var(--pine)':'var(--lost)');}
render();
</script>
</body>
</html>
